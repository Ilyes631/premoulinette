[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "premoulinette"
version = "0.1.0"
description = "Local pre-grader: test a programming assignment against its subject before the real submission."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.11",
  "python-multipart>=0.0.18",
  "beautifulsoup4>=4.12",
  "pypdf>=5.0",
  "markdown-it-py>=3.0",
  "httpx>=0.27",
  "anthropic>=0.60",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
premoulinette = "premoulinette.__main__:main"

[tool.setuptools.packages.find]
include = ["premoulinette*"]

[tool.setuptools.package-data]
"premoulinette.languages.python" = ["harness/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
